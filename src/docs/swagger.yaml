openapi: 3.0.3
info:
  title: TaskBoard API
  version: 1.0.0
  description: API REST inicial com Express, JWT e MongoDB.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Tasks
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Luana
        email:
          type: string
          format: email
          example: luana@email.com
        password:
          type: string
          format: password
          example: 123456
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          example: Implementar fluxo de login
        description:
          type: string
          example: Detalhes da implementacao JWT.
    TaskResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          example: pendente
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTaskEnvelope:
      type: object
      properties:
        task:
          $ref: "#/components/schemas/TaskResponse"
    TasksListEnvelope:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskResponse"
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check API health
      responses:
        "200":
          description: Service is healthy
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid payload or existing user
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user and return JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Return current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
        "401":
          description: Unauthorized
  /api/tasks:
    get:
      tags: [Tasks]
      summary: List personal tasks for authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tasks owned by the user (empty array if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasksListEnvelope"
        "401":
          description: Missing or invalid JWT
    post:
      tags: [Tasks]
      summary: Create personal task for authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created with status pendente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTaskEnvelope"
        "400":
          description: Missing or invalid fields
        "401":
          description: Missing or invalid JWT
